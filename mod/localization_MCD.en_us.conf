  "More Civilian Discussion"\
  ""
  "Hostile civilian: armed chance"\
  ""
  "When approaching a hostile civilian, chance (%) they pull out a weapon."\
  ""
  "Conversion chance"\
  ""
  "Base chance (%) to successfully convert a neutral civilian to the resistance."\
  ""
  "Failed conversion: hostile chance"\
  ""
  "When a conversion fails on a neutral civilian, chance (%) the civilian turns hostile."\
  ""
  "Conversion jackpot chance"\
  ""
  "On a successful conversion, chance (%) the civilian is a resistance enthusiast who brings 2 friends — granting 3 supporters at once. Set to 0 to disable."\
  ""
  "Extortion: hostile chance"\
  ""
  "When extorting a civilian, chance (%) they turn into an active combatant."\
  ""
  "Enemy presence: neutral share chance"\
  ""
  "Chance (%) a neutral civilian agrees to share info about current enemy presence nearby."\
  ""
  "Enemy presence: hostile report chance"\
  ""
  "When a hostile civilian refuses, chance (%) they report the player to authorities (raises heat)."\
  ""
  "Hostile civilian: suicide bomb chance"\
  ""
  "When greeting a hostile civilian, chance (%) they detonate an explosion. 0 disables the feature."\
  ""
  "Hostile civilian: enemy alert radius"\
  ""
  "Radius (m) around a hostile civilian to check for nearby enemy soldiers. If enemies are found, the player immediately becomes wanted. Set to 0 to disable."\
  ""
  "Hostile civilian: alert heat level"\
  ""
  "Heat level applied when a hostile civilian alerts nearby enemy soldiers. Higher values mean a stronger wanted response."\
  ""
  "Hostile civilian: call Military Police chance"\
  ""
  "Chance (%) a hostile civilian calls the Military Police after a confrontation (greet, extort, or report). Triggers a QRF response identical to a phone box call. 0 disables the feature."\
  ""
  "Greeting: friendly reaction chance"\
  ""
  "Chance (%) a civilian reacts in a friendly way when first greeted, marking them as a sympathizer. Friendly + hostile should stay under 100%; the remainder react neutrally."\
  ""
  "Greeting: hostile reaction chance"\
  ""
  "Chance (%) a civilian reacts with hostility when first greeted (may alert nearby enemies, call the Military Police, or detonate). Friendly + hostile should stay under 100%; the remainder react neutrally."\
  ""
