  "Friendly civilian: gift chance"\
  ""
  "When you ask a friendly civilian for help, chance (%) they give you a non-weapon item from your faction's catalog. 0 disables gifts."\
  ""
  "Friendly civilian: patience cost per request"\
  ""
  "How much patience each 'Ask for help' uses (out of 100). When patience runs out the civilian tires of you and stops supporting (back to neutral). Higher = fewer requests before they refuse."\
  ""
  "REMIXED - PVE"\
  ""
  "Overview"\
  ""
  "Freedom Fighters REMIXED - PVE is a cooperative (PvE) overhaul of Freedom Fighters: a living war of liberation where reconnaissance, intelligence and logistics drive progress. This chapter covers everything that DIFFERS from the original Freedom Fighters - read it first."\
  ""
  "What changes"\
  ""
  "In short: no solo play (resting, time-skip and fast travel are removed or limited); the map starts empty and is revealed by intelligence; respawn is automatic on the best available base; the enemy is modernised, with drones, anti-air and jammers; and your side is the French Army."\
  ""
  "Finding your way"\
  ""
  "The other manual chapters (Freedom Fighters) still explain the game basics, but whenever a page contradicts REMIXED, THIS chapter is authoritative."\
  ""
  "Spawn & deployment"\
  ""
  "At launch a starting FOB is placed automatically and no town has partisans: the whole map is up for grabs. You join the fight directly, without picking a spot on the map."\
  ""
  "Automatic deployment"\
  ""
  "On connect or after death you deploy on the BEST available base. Hierarchy: MOB > FOB / Camp > Town. A base is disabled as soon as a higher-tier base is usable (a MOB disables FOBs and towns). When you reconnect, you respawn where you disconnected."\
  ""
  "Dying"\
  ""
  "On death a black screen and a countdown precede redeployment. Respawning on a FOB with no depot is free; otherwise it costs supplies. Respawning too fast (suicide) applies a delay penalty."\
  ""
  "Intelligence & map"\
  ""
  "For non-admins the map starts EMPTY: no POIs, no territory control, no free markers. Intelligence reveals the ground, piece by piece."\
  ""
  "Finding intel"\
  ""
  "Intel comes as a document giving GRID coordinates (read them in its description). Two main sources: a friendly civilian tipping you off, and the body of a killed enemy (rare). A civilian may also tell you out loud where a nearby enemy is."\
  ""
  "Camps & missions"\
  ""
  "A cache document launches an enemy CAMP to clear (garrison + loot), up to 3 at once. Dynamic missions (DARC) exist everywhere but stay INVISIBLE until a civilian gives you their coordinates."\
  ""
  "Reliability"\
  ""
  "Not all intel is reliable: a civilian rumour is imprecise and sometimes FALSE (an empty grid = a trip for nothing). Officer documents are reliable and precise. Intel EXPIRES: an uncleared camp vanishes after a while, so act fast. Beware: mistreating the population pushes hostile civilians to report you."\
  ""
  "Squads & command"\
  ""
  "Squads are predefined (Infantry, Cavalry, Engineers, Fire Support, Reconnaissance, Artillery, Aviation/pilots, Medical, Command...). Free squad creation is blocked: join an existing one."\
  ""
  "Command staff"\
  ""
  "The Command squad forms the command staff. Its members drive strategic requests and have dedicated tools - no server admin needed."\
  ""
  "Procurement (requests)"\
  ""
  "Buying or importing a vehicle goes through a REQUEST: a player creates it, a command-staff member validates it via the #demandes command (Accept / Refuse). On approval the vehicle is delivered and supplies are debited."\
  ""
  "Armoury & loadouts"\
  ""
  "At arsenal crates (FOB / MOB) you can take a ready-made LOADOUT (Take: Rifleman, Take: Machine gunner...). Scroll the wheel over an action to preview its contents."\
  ""
  "Supply cost"\
  ""
  "A loadout is not free: it costs the real sum of its items, debited from the nearest FOB depot. Swapping two loadouts of equal value is a free exchange (what you already invested is refunded)."\
  ""
  "Your own loadouts"\
  ""
  "Save my loadout stores your current gear on the server (up to 5). On the site arma.collectifxxl.fr (the My Soldier page), after linking your Discord, you can rename or delete them. You only see YOUR loadouts, plus the faction loadouts."\
  ""
  "Economy & logistics"\
  ""
  "Progress is paced by logistics. Three income sources: naval resupply, looting enemy convoys, and captured factories that produce over time."\
  ""
  "Naval resupply"\
  ""
  "Periodically a resupply crate appears AT SEA near the FOB (grid notification). Load the supplies via logistics and BRING them physically back to a base - a vulnerable convoy. The crate leaves if ignored too long."\
  ""
  "Convoys & vulnerability"\
  ""
  "Defeated enemy convoys leave a truck full of supplies to bring back. Beware: the enemy cuts roads (checkpoints, patrols) and launches counter-attacks to retake your bases and factories. Secure your supply chain."\
  ""
  "The enemy threat"\
  ""
  "The enemy (Russian forces) is modernised, better equipped and more dangerous than in the original Freedom Fighters. Its lethality is adjustable and grows with the campaign."\
  ""
  "Difficulty per force"\
  ""
  "From weakest to deadliest: Regular < Naval Infantry < KLMK < Spetsnaz. Spetsnaz shoot with near-perfect accuracy and spot from afar - avoid direct fights."\
  ""
  "Air, drones & jammers"\
  ""
  "The enemy deploys anti-air (Igla MANPADS): fly LOW to dodge. It also operates drones - a recon drone spots you then commands suicide drones (FPV), and a drone can drop grenades. JAMMERS (bags, vehicles, points) neutralise YOUR drones: destroy them to take back the sky."\
  ""
  "Combat realism"\
  ""
  "Several settings bring combat closer to reality."\
  ""
  "Movement"\
  ""
  "Dense vegetation (bushes) SLOWS you down noticeably more than in the base game. Plan your routes."\
  ""
  "Aiming"\
  ""
  "Aiming (ADS) sways depending on your stance, stamina and whether the weapon is rested on a support. Also, a FOREIGN weapon (picked off an enemy, outside your faction catalogue) sways far more: keep your issued weapon to shoot straight."\
  ""
  "The French Army (AMF)"\
  ""
  "Your side is no longer the generic FIA: it is the French Army, re-equipped with AMF content."\
  ""
  "Equipment"\
  ""
  "French vehicles: GBC180 trucks, VBL light armour, VBMR Griffon and VBCI. French uniforms in CCE camouflage (FELIN helmet, F3 fatigues) and FR weapons per role (HK416F, FAMAS, Minimi, SCAR-H, PGM, AT4CS...)."\
  ""
  "Identity"\
  ""
  "Name French Army, French flag and faces, French radio callsigns and ranks (from Private to Colonel). Spawning at a FOB you get a light FR uniform and a French pistol."\
  ""
  "Welcome to Freedom Fighters REMIXED - PVE"\
  ""
  "Freedom Fighters REMIXED - PVE is a <b>cooperative (PvE)</b> overhaul of Freedom Fighters. You serve in the French Army on a theatre of liberation where reconnaissance, intelligence and logistics drive progress.<br/><br/>Join the <b>Discord community</b> by scanning the code on the right to report bugs, discuss the project and find help.<br/><br/>Good luck!"\
  ""
  "The <b>Field Manual</b> explains how to play. Open it and read the <b>REMIXED - PVE</b> chapter: it covers everything that differs from the base game. Accessible any time from the pause menu."\
  ""
