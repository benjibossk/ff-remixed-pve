  "Any enemies nearby?"\
  ""
  "Hey there, citizen."\
  ""
  "Good day. Do you have a moment?"\
  ""
  "Hello. Don't be alarmed."\
  ""
  "Have you seen any soldiers around here?"\
  ""
  "Are there any enemy patrols nearby?"\
  ""
  "Any military activity in the area?"\
  ""
  "Good to see you! Stay safe out there."\
  ""
  "Thank god you're here. Keep fighting!"\
  ""
  "We're with you. Don't give up."\
  ""
  "I don't want any trouble."\
  ""
  "I'd rather not get involved... but go on."\
  ""
  "What do you want? Make it quick."\
  ""
  "Get away from me! I'll report you!"\
  ""
  "You terrorists are all the same. I'm calling the authorities!"\
  ""
  "Don't come near me! I know who you are!"\
  ""
  "Yes, there are soldiers not far from here. Be careful."\
  ""
  "I heard gunfire nearby. They must be close."\
  ""
  "There's a patrol in the area. I saw them behind the church."\
  ""
  "I haven't seen anyone. Seems clear to me."\
