  "Plus de discussions civiles"\
  ""
  "Civil hostile : chance d'être armé"\
  ""
  "En approchant un civil hostile, chance (%) qu'il sorte une arme."\
  ""
  "Chance de conversion"\
  ""
  "Chance de base (%) de convertir un civil neutre à la résistance."\
  ""
  "Conversion ratée : chance d'hostilité"\
  ""
  "Quand une conversion échoue sur un civil neutre, chance (%) qu'il devienne hostile."\
  ""
  "Chance de jackpot à la conversion"\
  ""
  "Lors d'une conversion réussie, chance (%) que le civil soit un enthousiaste qui amène 2 amis — soit 3 sympathisants d'un coup. 0 pour désactiver."\
  ""
  "Extorsion : chance d'hostilité"\
  ""
  "En extorquant un civil, chance (%) qu'il devienne un combattant actif."\
  ""
  "Présence ennemie : chance de partage (neutre)"\
  ""
  "Chance (%) qu'un civil neutre accepte de partager des infos sur la présence ennemie à proximité."\
  ""
  "Présence ennemie : chance de dénonciation (hostile)"\
  ""
  "Quand un civil hostile refuse, chance (%) qu'il dénonce le joueur aux autorités (augmente la traque)."\
  ""
  "Civil hostile : chance d'attentat suicide"\
  ""
  "En saluant un civil hostile, chance (%) qu'il déclenche une explosion. 0 désactive la fonction."\
  ""
  "Civil hostile : rayon d'alerte ennemie"\
  ""
  "Rayon (m) autour d'un civil hostile pour détecter des soldats ennemis proches. Si des ennemis sont trouvés, le joueur devient immédiatement recherché. 0 pour désactiver."\
  ""
  "Civil hostile : niveau de traque à l'alerte"\
  ""
  "Niveau de traque appliqué quand un civil hostile alerte les soldats ennemis proches. Plus la valeur est haute, plus la réaction est forte."\
  ""
  "Civil hostile : chance d'appeler la Police Militaire"\
  ""
  "Chance (%) qu'un civil hostile appelle la Police Militaire après une confrontation (salut, extorsion ou dénonciation). Déclenche une QRF identique à un appel depuis une cabine. 0 désactive la fonction."\
  ""
  "Salutation : chance de réaction amicale"\
  ""
  "Chance (%) qu'un civil réagisse amicalement au premier salut, le marquant comme sympathisant. Amical + hostile doivent rester sous 100 % ; le reste réagit neutrement."\
  ""
  "Salutation : chance de réaction hostile"\
  ""
  "Chance (%) qu'un civil réagisse avec hostilité au premier salut (peut alerter les ennemis proches, appeler la Police Militaire ou se faire exploser). Amical + hostile doivent rester sous 100 % ; le reste réagit neutrement."\
  ""
