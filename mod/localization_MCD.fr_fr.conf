  "Civil amical : chance de don"\
  ""
  "Quand vous demandez de l'aide à un civil amical, chance (%) qu'il vous donne un objet (hors arme) du catalogue de votre faction. 0 désactive les dons."\
  ""
  "Civil amical : coût de patience par demande"\
  ""
  "Patience consommée par chaque « Demander de l'aide » (sur 100). Une fois épuisée, le civil se lasse et cesse de vous soutenir (redevient neutre). Plus haut = moins de demandes avant refus."\
  ""
  "REMIXED - PVE"\
  ""
  "Vue d'ensemble"\
  ""
  "Freedom Fighters REMIXED - PVE est une refonte coopérative (JcE) de Freedom Fighters : une guerre de libération vivante où la reconnaissance, le renseignement et la logistique commandent la progression. Ce chapitre décrit tout ce qui DIFFÈRE du Freedom Fighters d'origine — à lire en premier."\
  ""
  "Ce qui change"\
  ""
  "En bref : plus de jeu solo (repos, saut de temps et voyage rapide retirés ou limités) ; la carte démarre vide et se dévoile au renseignement ; le respawn est automatique sur la meilleure base ; l'ennemi est modernisé, doté de drones, d'anti-aérien et de brouilleurs ; et votre camp est l'Armée française."\
  ""
  "Se repérer"\
  ""
  "Les autres chapitres du manuel (Freedom Fighters) restent valables pour les bases du jeu, mais quand une page contredit REMIXED, c'est CE chapitre qui fait foi."\
  ""
  "Spawn & déploiement"\
  ""
  "Au lancement, une FOB de départ est posée automatiquement et aucune ville n'a de partisans : toute la carte est à conquérir. Vous rejoignez le combat directement, sans choisir de point sur la carte."\
  ""
  "Déploiement automatique"\
  ""
  "À la connexion ou après la mort, vous êtes déployé sur la MEILLEURE base disponible. Hiérarchie : MOB > FOB / Camp > Ville. Une base est coupée dès qu'une base d'un rang supérieur est utilisable (une MOB coupe les FOB et les villes). En vous reconnectant, vous réapparaissez là où vous vous êtes déconnecté."\
  ""
  "Mourir"\
  ""
  "À la mort, un écran noir et un décompte précèdent le redéploiement. Le respawn sur une FOB sans dépôt est gratuit ; sinon il coûte du ravitaillement. Réapparaître trop vite (suicide) applique une pénalité de délai."\
  ""
  "Renseignement & carte"\
  ""
  "Pour les non-admins, la carte démarre VIDE : plus de POI, de contrôle de territoire ni de marqueurs offerts. C'est le renseignement qui révèle le terrain, pièce par pièce."\
  ""
  "Trouver du renseignement"\
  ""
  "Le renseignement prend la forme d'un document indiquant des COORDONNÉES en grille (à lire dans sa description). Deux sources principales : un civil amical qui vous tuyaute, et le corps d'un ennemi tué (rare). Un civil peut aussi vous indiquer de vive voix la position d'un ennemi proche."\
  ""
  "Camps & missions"\
  ""
  "Un document de cache lance un CAMP ennemi à nettoyer (garnison + butin), jusqu'à 3 en même temps. Les missions dynamiques (DARC) existent partout mais restent INVISIBLES tant qu'un civil ne vous en donne pas les coordonnées."\
  ""
  "Fiabilité"\
  ""
  "Toute information n'est pas fiable : une rumeur civile est imprécise et parfois FAUSSE (une grille vide = un déplacement pour rien). Les documents d'officier sont fiables et précis. Le renseignement PÉRIME : un camp non nettoyé disparaît après un temps, agissez vite. Attention : maltraiter la population pousse les civils hostiles à vous dénoncer."\
  ""
  "Escouades & état-major"\
  ""
  "Les escouades sont prédéfinies (Infanterie, Cavalerie, Génie, Appui-feu, Reconnaissance, Artillerie, ALAT/pilotes, Santé, Commandement...). La création libre d'escouade est bloquée : rejoignez-en une existante."\
  ""
  "État-major"\
  ""
  "L'escouade Commandement forme l'état-major. Ses membres pilotent les demandes stratégiques et disposent d'outils dédiés — pas besoin d'être admin serveur."\
  ""
  "Procurement (demandes)"\
  ""
  "Acheter ou importer un véhicule passe par une DEMANDE : un joueur la crée, un membre de l'état-major la valide via la commande #demandes (Accepter / Refuser). À la validation, le véhicule est livré et le ravitaillement débité."\
  ""
  "Armurerie & dotations"\
  ""
  "Aux caisses d'arsenal (FOB / MOB), vous pouvez prendre une DOTATION prête à l'emploi (« Prendre : Fusilier », « Prendre : Mitrailleur »...). Passez la molette sur une action pour voir le contenu en aperçu."\
  ""
  "Coût en ravitaillement"\
  ""
  "Une dotation n'est pas gratuite : elle coûte la vraie somme de ses objets, débitée sur le dépôt de la FOB la plus proche. Échanger deux dotations de même valeur revient à un échange gratuit (le déjà-investi est remboursé)."\
  ""
  "Vos propres tenues"\
  ""
  "« Enregistrer ma tenue » sauvegarde votre équipement actuel sur le serveur (jusqu'à 5). Sur le site arma.collectifxxl.fr (page « Mon Soldat »), après avoir lié votre Discord, vous pouvez les renommer ou les supprimer. Vous ne voyez que VOS tenues, plus les dotations de faction."\
  ""
  "Économie & logistique"\
  ""
  "La progression est rythmée par la logistique. Trois sources de revenus : le ravitaillement par la marine, le pillage de convois ennemis, et les usines capturées qui produisent dans le temps."\
  ""
  "Ravitaillement marine"\
  ""
  "Périodiquement, une caisse de ravitaillement apparaît EN MER près de la FOB (notification en grille). Chargez les supplies via la logistique et RAMENEZ-les physiquement à une base — un convoi vulnérable. La caisse repart si on l'ignore trop longtemps."\
  ""
  "Convois & vulnérabilité"\
  ""
  "Les convois ennemis vaincus laissent un camion plein de supplies à ramener. Attention : l'ennemi coupe les routes (checkpoints, patrouilles) et lance des contre-attaques pour reprendre vos bases et usines. Sécurisez votre chaîne logistique."\
  ""
  "La menace ennemie"\
  ""
  "L'ennemi (forces russes) est modernisé, mieux équipé et plus dangereux qu'en Freedom Fighters d'origine. Sa dangerosité est réglable et croît avec la campagne."\
  ""
  "Difficulté par force"\
  ""
  "Du plus faible au plus mortel : Régulier < Infanterie navale < KLMK < Spetsnaz. Les Spetsnaz tirent avec une précision quasi parfaite et repèrent de loin — évitez le combat direct."\
  ""
  "Air, drones & brouilleurs"\
  ""
  "L'ennemi déploie de l'anti-aérien (MANPADS Igla) : volez BAS pour esquiver. Il opère aussi des drones — un drone de reconnaissance vous repère puis commande des drones-suicides (FPV), et un drone peut larguer des grenades. Des BROUILLEURS (sacs, véhicules, points) neutralisent VOS drones : détruisez-les pour reprendre le ciel."\
  ""
  "Réalisme au combat"\
  ""
  "Plusieurs réglages rapprochent le combat du réel."\
  ""
  "Déplacement"\
  ""
  "La végétation dense (buissons) vous RALENTIT nettement plus qu'en jeu de base. Prévoyez vos itinéraires."\
  ""
  "Visée"\
  ""
  "La visée (ADS) oscille selon votre posture, votre endurance et si l'arme est reposée sur un appui. De plus, une arme ÉTRANGÈRE (ramassée sur un ennemi, hors catalogue de votre faction) tremble beaucoup plus : gardez votre armement de dotation pour tirer juste."\
  ""
  "L'Armée française (AMF)"\
  ""
  "Votre camp n'est plus la FIA générique : c'est l'Armée française, rééquipée avec le contenu AMF."\
  ""
  "Matériel"\
  ""
  "Véhicules français : camions GBC180, blindés légers VBL, VBMR Griffon et VBCI. Tenues françaises en camouflage CCE (casque FELIN, treillis F3) et armement FR par rôle (HK416F, FAMAS, Minimi, SCAR-H, PGM, AT4CS...)."\
  ""
  "Identité"\
  ""
  "Nom « Armée française », drapeau et visages français, appels radio et grades français (du Soldat au Colonel). Au spawn en FOB, vous recevez une tenue légère FR et un pistolet français."\
  ""
  "Bienvenue dans Freedom Fighters REMIXED - PVE"\
  ""
  "Freedom Fighters REMIXED - PVE est une refonte <b>coopérative (JcE)</b> de Freedom Fighters. Vous servez dans l'Armée française sur un théâtre de libération où la reconnaissance, le renseignement et la logistique commandent la progression.<br/><br/>Rejoignez la <b>communauté Discord</b> en scannant le code à droite pour signaler des bugs, discuter du projet et trouver de l'aide.<br/><br/>Bonne chance !"\
  ""
  "Le <b>Manuel de Terrain</b> explique comment jouer. Ouvrez-le et consultez le chapitre <b>« REMIXED - PVE »</b> : il décrit tout ce qui diffère du jeu de base. Accessible à tout moment via le menu pause."\
  ""
 }
}
