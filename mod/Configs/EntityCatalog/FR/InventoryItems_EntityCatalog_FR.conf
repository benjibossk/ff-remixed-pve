// Catalogue d'inventaire FR -- on RETIRE les galons de grade de l'arsenal.
//
// POURQUOI. Les galons ADT etaient des items d'arsenal comme les autres : n'importe qui
// pouvait s'equiper en colonel. Le grade affiche ne voulait plus rien dire. Depuis
// FFRX_RankPatch.c, le galon est pose AUTOMATIQUEMENT selon le grade reel du soldat
// (registre Fleet, persistant par UID) -- il n'a donc plus rien a faire en libre-service.
//
// CE QU'ON NE TOUCHE PAS : les autres patchs (patronymique, groupe sanguin, insignes de
// regiment, operations BARKHANE/SANGARIS/CHAMMAL...) restent disponibles. Ce sont des
// choix de personnalisation, pas des marques de hierarchie.
//
// ATTENTION : La desactivation se fait par GUID D'INSTANCE, a la profondeur EXACTE de l'original
// (m_aMultiLists > SCR_EntityCatalogMultiListEntry > m_aEntities). Un GUID neuf, ou un
// niveau saute, n'ecraserait rien : l'entree serait ignoree SANS erreur.
//
// GENERE depuis le catalogue d'AMF-FANTASSIN 1.3.4. Si AMF ajoute ou renomme des galons,
// regenerer (scratchpad/gen_catalog_override.py).

