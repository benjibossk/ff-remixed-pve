// Catalogue d'inventaire FR -- variante DESERT (theatre Anizay, camo Daguet).
//
// Un catalogue par theatre : celui-ci (desert) et le catalogue FR d'origine, utilise
// par Everon en woodland. Les deux partagent la meme base (armes, equipement, sacs,
// berets, gilets, t-shirts) ; seules les pieces de CAMO different.
//
// Ici on desactive les 6 pieces Centre Europe : sur Anizay, un uniforme vert au
// milieu du desert n'a pas de sens et polluait la liste de l'arsenal.
// Berets, gilets et t-shirts sont volontairement CONSERVES : ce sont des insignes de
// regiment ou des tenues hors-combat, pas du camo de theatre.
//
// ATTENTION : La desactivation se fait par GUID D'INSTANCE, a la profondeur exacte de
// l'original (m_aMultiLists > SCR_EntityCatalogMultiListEntry {6532BE0C683AAA27} >
// m_aEntities). Un GUID neuf, ou un niveau saute, n'ecraserait rien : l'entree serait
// simplement ignoree et l'objet resterait actif.
//
// NOTE : le filtrage automatique par biome n'est PAS utilisable. FF sait comparer les
// biomes (JWK_VehicleManagerConfig.Matches l.248) et JWK_WorldEntity porte bien
// m_iBiome DESERT, mais AUCUN appelant ne renseigne ce champ dans une requete -- la
// seule affectation du code le met a UNDEFINED. Le filtre est donc inerte, d'ou ce
// catalogue explicite.
//
// NOTE 2026-09-10 : la racine doit etre SCR_EntityCatalogMultiList (la classe de
// l'original AMF), pas SCR_EntityCatalog -- sinon "Unknown class 'SCR_EntityCatalog'"
// au chargement et le catalogue entier est perdu. Ici l'heritage est LEGITIME (ce
// fichier a son propre GUID {6FFEC0DEDA000610} et derive du catalogue AMF), contrairement
// a InventoryItems_EntityCatalog_FR.conf qui, lui, est un shadow-override sans heritage.
SCR_EntityCatalogMultiList : "{833F123257E3C40B}Configs/EntityCatalog/FR/InventoryItems_EntityCatalog_FR.conf" {
 m_aMultiLists {
  SCR_EntityCatalogMultiListEntry "{6532BE0C683AAA27}" {
   m_aEntities {
    SCR_EntityCatalogInventoryItem "{6532BE0C68390229}" {
     m_bEnabled 0
    }
    SCR_EntityCatalogInventoryItem "{657728A7A7558DD4}" {
     m_bEnabled 0
    }
    SCR_EntityCatalogInventoryItem "{6532BE0C68390C06}" {
     m_bEnabled 0
    }
    SCR_EntityCatalogInventoryItem "{662D5071EF8E2EA2}" {
     m_bEnabled 0
    }
    SCR_EntityCatalogInventoryItem "{662D5A2667265BB0}" {
     m_bEnabled 0
    }
    SCR_EntityCatalogInventoryItem "{6532BE0C683972BD}" {
     m_bEnabled 0
    }
   }
  }
 }
}
