// FF - REMIXED - PVE -- shadow-override of the MEI mod's FactionIdentity {023AB5F7607F7E70}.
//
// A .conf override REPLACES the whole file, so the sound and social sections are
// copied verbatim below -- dropping them would leave MEI mute and nameless.
//
// WHAT CHANGES: exactly one entry. The mod's first VisualIdentity used the VANILLA
// Head_Black_02 + CharacterBasebody_Black_02, so one insurgent in six spawned with
// a base-game body among five takistani ones. Meanwhile the mod ships a sixth
// takistani head, Head_BaseBody_01_tk {0A5C8DB3688354A3}, that it never referenced.
// We swap the vanilla entry for that unused head: same count of appearances (6),
// but all consistent, and CharacterBasebody_tk on every one.
//
// LIMIT: 6 is the ceiling -- the mod only ships 6 head prefabs. More variety would
// require new head assets, not config. Faces/bodies are assigned by the FACTION at
// runtime (not by the character prefabs), so this applies to every MEI unit
// including our own Air/Javelin/Jammer specialists, which inherit affiliation "MEI"
// from Character_MEI_Base.
FactionIdentity {
 VisualIdentityArray {
  VisualIdentity "{570CE64C790A3C7D}" : "{FAE42E51C156837C}Configs/Identities/VisualIdentity_base.conf" {
   Head "{0A5C8DB3688354A3}Prefabs/Characters/Heads/Head_BaseBody_01_tk.et"
   Body "{AABB78B5B9C32D0B}Prefabs/Characters/Basebody/CharacterBasebody_tk.et"
  }
  VisualIdentity "{570CE64C784286B5}" : "{FAE42E51C156837C}Configs/Identities/VisualIdentity_base.conf" {
