  // ====================================================================================
  //  NOUVEAUX CONSTRUCTIBLES -- releves dans le catalogue Game Master (2026-09-19)
  // ====================================================================================
  //
  //  POURQUOI C'EST POSSIBLE MAINTENANT. La roadmap notait un cout cache : "chaque item
  //  exige un prefab fantome (m_aGhosts) a creer". Depuis le chantier
  //  (FFRX_BuildSite.c), un item sans fantome retombe sur son prefab reel -- il a fallu
  //  l'ecrire de toute facon, 8 des 23 batiments FF n'en ont deja aucun. Ajouter un
  //  batiment ne demande donc plus qu'une entree ici.
  //
  //  D'OU VIENNENT CES DONNEES. Chaque prefab editable du Game Master
  //  (PrefabsEditable/Auto/Structures/.../E_Xxx.et) porte les trois choses qu'il nous
  //  faut : sa ligne d'heritage donne le GUID du prefab REEL, son m_UIInfo donne la cle
  //  de nom et l'image d'apercu. On reprend donc les vignettes du Game Master telles
  //  quelles, et les titres sont des cles de localisation -- traduction gratuite.
  //
  //  ON REFERENCE LE PREFAB REEL, JAMAIS L'EDITABLE. L'editable herite du reel et ajoute
  //  un SCR_EditableEntityComponent : deplacable en Game Master et plus lourd. C'est la
  //  meme substitution que sur les cabines telephoniques d'Anizay.
  //
  //  m_iSuppliesCost SERT DEUX FOIS : le prix, ET la duree de chantier (2 points de pelle
  //  par supply, compresse au-dela de 400). Le regler, c'est regler les deux.
  //
  //  m_iCategory : tout en GENERIC pour l'instant. FF n'expose que GENERIC /
  //  STORAGE_SUPPLIES / GARAGE / COMMAND_POST ; on ajoutera les notres par
  //  `modded enum JWK_EBuildableCategory` quand on voudra trier.
// 33 entrees generees depuis le catalogue Game Master (2026-09-19).
