  // ====================================================================================
  //  LOT 2 -- COMPOSITIONS du Game Master (PrefabsEditable/Auto/Compositions/Slotted)
  // ====================================================================================
  //
  //  C'EST LE VRAI CATALOGUE. Les "batiments en dur" ne sont PAS dans Structures cote
  //  Game Master (aucune categorie Military/Houses) : ils sont ici, sous forme de
  //  COMPOSITIONS. 101 des 105 fichiers portent une vignette et un nom localise, la ou
  //  Misc/SubCompositions/* n'a ni image ni nom (juste "(Barracks_01_FIA_01)").
  //
  //  "Slotted" DECRIT OU L'EDITEUR LES PROPOSE, PAS UNE CONTRAINTE. Verifie : le prefab
  //  REEL (Checkpoint_S_US_01.et) derive de BuildableComposition_Base et porte un
