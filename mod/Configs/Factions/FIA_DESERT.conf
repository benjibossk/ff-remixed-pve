// Variante desert de la faction joueur (camo Daguet). Herite de notre FIA.conf :
// recupere le drapeau, les grades, l'identite et le catalogue d'arsenal.
//
// UIInfo redeclare UNIQUEMENT pour le libelle : sans ca, FIA et FIA_DESERT
// s'affichent toutes les deux "Armee Francaise" dans le menu Nouveau jeu, et il
// devient impossible de savoir laquelle est selectionnee.
//
// ⚠️ LE GUID D'INSTANCE DOIT ETRE CELUI DU PARENT ({5570936866E0AD08}, cf.
// FIA.conf l.3). Un objet imbrique s'override en REUTILISANT le GUID de
// l'instance heritee ; avec un GUID neuf on ne remplace rien, la declaration est
// ignoree et le libelle du parent l'emporte -> deux "Armee Francaise" identiques
// dans la liste, exactement le bug qu'on voulait eviter.
SCR_Faction : "{8053DB656DD18B14}Configs/Factions/FIA.conf" {
 FactionKey "FIA_DESERT"
 UIInfo SCR_FactionUIInfo "{5570936866E0AD08}" {
  Name "Armée Française (Daguet)"
  Icon "{F2616FF4B5B5B4F3}UI/Textures/EditableEntities/Factions/FRANCE/Editable_Entity_Flag_FR.edds"
 }
 // Un catalogue d'inventaire par theatre. On reprend le GUID d'instance du parent
 // ({5C68C44CB0CFC935}, cf. FIA.conf) et on le fait pointer sur la variante desert,
 // qui desactive les 6 pieces Centre Europe. Everon garde le catalogue d'origine.
 m_aEntityCatalogs {
  SCR_EntityCatalogMultiList "{5C68C44CB0CFC935}" : "{6FFEC0DEDA000610}Configs/EntityCatalog/FR/InventoryItems_EntityCatalog_FR_DESERT.conf" {
  }
 }
}
