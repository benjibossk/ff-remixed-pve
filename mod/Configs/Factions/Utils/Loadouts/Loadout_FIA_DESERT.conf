// Tenue de spawn du joueur sur le theatre desert (Anizay) -- camo Daguet.
//
// POURQUOI CE FICHIER : FF_FIA_DESERT.conf herite de FF_FIA.conf, donc AUSSI de son
// m_PlayerRoleTrait -> les joueurs d'Anizay spawnaient avec le loadout d'Everon,
// c'est-a-dire en camo CE (Centre Europe) au milieu du desert. Les personnages IA
// FIA_DA etaient bien en Daguet, mais le JOUEUR ne spawne pas depuis ces prefabs :
// il spawne depuis ce loadout-la.
//
// On herite de notre Loadout_FIA.conf (armement, sets d'armes, objets de base) et on
// ne remplace QUE les pieces de camo.
//
// ⚠️ Les slots s'overrident par GUID D'INSTANCE : chaque JWK_LoadoutSlotConfig
// ci-dessous reprend le GUID exact du slot parent (Loadout_FIA.conf). Avec un GUID
// neuf on n'ecraserait rien -- on ajouterait un slot ignore et le parent l'emporterait.
//
// Veste et pantalon SANS patch ni galon : F3_Ubas_Rolled_DA (et non la variante
// _Patch_FRANCE_BV01_1erClasse). Le grade et les insignes doivent venir du joueur,
// pas d'un uniforme impose au spawn.
JWK_LoadoutConfig : "{FC92D8C94D43E74A}Configs/Factions/Utils/Loadouts/Loadout_FIA.conf" {
 m_aSlots {
  JWK_LoadoutSlotConfig "{65F4A88D930AC7A9}" {
   m_iType HEADWEAR
   m_fSkipChance 0
   m_aChoices {
    "{01277905A781CDF4}Prefabs/Characters/HeadGear/BERET/beret_Bleu_Fonce_Infanterie.et"
   }
  }
  JWK_LoadoutSlotConfig "{65F4A88D936E279C}" {
   m_iType SHIRT
   m_aChoices {
    "{9C495D014D582C64}Prefabs/Characters/Uniforms/F3_Ubas/DA/F3_Ubas_Rolled_DA.et"
   }
  }
  JWK_LoadoutSlotConfig "{65F4A88D935A1540}" {
   m_iType PANTS
   m_aChoices {
    "{F277891AB79F482D}Prefabs/Characters/Uniforms/F3_Pantalon/F3_Pantalon_DA.et"
   }
  }
  JWK_LoadoutSlotConfig "{65F4A88D90881426}" {
   m_iType FOOTWEAR
   m_aChoices {
    "{253C75176D3BF9A4}Prefabs/Characters/Footwear/Haix_Sable_Base.et"
   }
  }
  JWK_LoadoutSlotConfig "{65F4A88D90F5DE54}" {
   m_iType BACKPACK
  }
 }
}
