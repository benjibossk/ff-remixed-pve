JWK_FactionConfig : "{8053DB656DD18B15}Configs/Factions/FF_FIA.conf" {
 m_sFactionKey "FIA_DESERT"
 // Le menu "Nouveau jeu" de FF affiche m_sCustomName. Il valait "Armee Francaise",
 // exactement comme la FIA d'Everon -> deux entrees identiques dans la liste, sans
 // moyen de savoir laquelle etait le theatre desert. Le suffixe est indispensable
 // ici, et pas seulement dans le SCR_Faction (qui, lui, sert au reste du jeu).
 m_sCustomName "Armee Francaise (Daguet)"
 // Tenue de spawn du JOUEUR. Sans ce bloc on herite du m_PlayerRoleTrait de
 // FF_FIA.conf, donc du loadout d'Everon : les joueurs d'Anizay apparaissaient en
 // camo CE (Centre Europe) en plein desert. Les personnages IA FIA_DA etaient bien
 // en Daguet, mais le joueur ne spawne PAS depuis ces prefabs -- il spawne depuis
 // le m_Loadout ci-dessous.
 //
 // Le GUID d'instance du trait reprend celui du parent ({668F43F2668CF5BE}, cf.
 // FF_FIA.conf l.104) : c'est ainsi qu'on remplace l'objet herite au lieu d'en
 // ajouter un second qui serait ignore.
 // On NE redeclare PAS l'heritage vers BaseTrait_PlayerRole.conf : cela repartirait
 // du trait vide et ferait perdre les indicatifs, phrases de passe, affiches et la
 // config radio heritees de FF_FIA. On ne pose que le GUID d'instance + le seul
 // champ a changer ; tout le reste continue d'etre herite.
 m_PlayerRoleTrait JWK_PlayerRoleFactionTrait "{668F43F2668CF5BE}" {
  m_Loadout JWK_LoadoutConfig "{6690F2BB9A5579ED}" : "{6FFEC0DEDA000600}Configs/Factions/Utils/Loadouts/Loadout_FIA_DESERT.conf" {
  }
 }
