 }
 // ★ MANQUAIT CHEZ FF -- c'est pour ca que MEI apparaissait dans "Faction du
 // joueur" mais PAS dans "Faction ennemie" au menu Nouveau jeu.
 // JWK_FactionManager.CanFactionTakeRole() (l.627) exige un trait PAR ROLE :
 //   AMBIENT    -> JWK_AmbientRoleFactionTrait
 //   PLAYER     -> JWK_PlayerRoleFactionTrait
 //   SUPPORTING -> JWK_SupportRoleFactionTrait
 //   ENEMY      -> JWK_EnemyRoleFactionTrait   <-- absent du FF_MEI.conf de FF
 // FF_MEI.conf declarait Common + Combat + PlayerRole, donc MEI n'etait
 // selectionnable QUE comme faction joueur. Sans ce bloc, impossible de la
 // designer comme ennemi, et m_sDefaultEnemyFaction "MEI" du JWK_World est
 // ignore (repli silencieux sur USSR).
 //
 // BaseTrait_EnemyRole.conf est VIDE : le trait seul suffit a rendre la faction
 // eligible. m_ResistanceLoadoutMixins est protected et auto-instancie s'il est
 // nul (JWK_EnemyRoleFactionTrait.c l.59) -- donc pas de NPE si on l'omet, mais
 // la resistance n'aurait alors aucune tenue MEI a recuperer sur les cadavres
 // (deguisement). On pointe sur le catalogue MEI, exactement comme FF_TKA.conf
 // (l.80) le fait avec Loadout_TKA.conf.
 m_EnemyRoleTrait JWK_EnemyRoleFactionTrait "{6FFEC0DEDA000210}" : "{589E9D69C1A87F5C}Configs/Factions/RoleTraits/BaseTrait_EnemyRole.conf" {
  m_ResistanceLoadoutMixins JWK_LoadoutConfig "{6FFEC0DEDA000211}" : "{FFC873580104C1F1}Configs/Factions/Utils/Loadouts/Loadout_MEI.conf" {
  }
 }
