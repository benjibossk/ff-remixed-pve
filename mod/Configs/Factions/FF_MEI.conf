// FF - REMIXED - PVE -- shadow-override of FF's MEI faction config {830970F42196ADB0}.
//
// WHY A FULL COPY: this file carries the SAME GUID as FF's, so it REPLACES it --
// it cannot inherit from itself. Everything below is FF's original content, plus
// our additions. FF's AddFactionConfig() refuses a second config for an existing
// faction key, so an integration config could not be used here.
// ==> IF FF UPDATES FF_MEI.conf, RE-DIFF THIS FILE against ff_XXX extract.
//
// WHAT THIS FIXES (verified in-editor 2026-08-29 by spawning all of them):
// 0. ★ FF's MEI FACTION WAS BROKEN. The MEI mod was rebuilt -- GUIDs regenerated
//    and roles renamed -- and FF never updated its references. Of the 18 infantry
//    prefabs FF declared, 17 failed to load ("Failed to open"); only
//    Character_MEI_Base still resolved, because its GUID happens to be unchanged.
//    BOTH of the two groups FF declared were dead too. So the faction had one
//    unarmed civilian and zero usable groups -- hence enemies falling back to
//    vanilla-looking characters. Every GUID below was decoded from the MOD'S OWN
//    resourceDatabase.rdb (the source of truth). Do NOT trust the paths/GUIDs
//    found by grepping cross-references inside the mod: several of those are
//    themselves stale leftovers pointing at the old version.
// 1. GROUPS. Now 4 patrol / 1 recon / 10 specialist / 1 HQ (was 1/0/1/0, all
//    broken). The MEI mod ships these; FF simply never referenced them.
// 2. CREWS. FF declared no pilot/aircrew/armour crew at all for MEI.
// 3. SPECIALISTS. Our Igla/Javelin/jammer operators, so Anizay is as dangerous as
//    Everon (where the USSR gets them through the Group_USSR_* overrides).
//
// NOTE: the mod ships its prefabs under .../IND/MEI/, FF referenced .../INDFOR/MEI/.
// Paths in .conf are informative (the GUID is what resolves) but ours use the real
// path so a future reader is not misled.
JWK_FactionConfig {
 m_sFactionKey "MEI"
 m_sCustomName "Middle East Insurgents"
 m_CommonTrait JWK_CommonFactionTrait "{66BF21378E9A1ECE}" : "{410CE2A8225A03D1}Configs/Factions/SharedTraits/BaseTrait_Common.conf" {
  m_aUnarmedCharacterPrefab {
   "{92EF7C750D05F9C9}Prefabs/Characters/Factions/IND/MEI/Character_MEI_Base.et"
  }
  m_aLanguages {
   ARABIC
  }
 }
 m_CombatTrait JWK_CombatFactionTrait "{66BF21378D5B0952}" : "{82DB0ECED64916BD}Configs/Factions/SharedTraits/BaseTrait_Combat.conf" {
  m_aForces {
   JWK_FactionForceConfig "{66BF21354EA24341}" {
    m_aUnarmedCharacters {
     "{92EF7C750D05F9C9}Prefabs/Characters/Factions/IND/MEI/Character_MEI_Base.et"
    }
    // ⚠️ 17 des 18 personnages que FF declarait ici etaient des REFERENCES MORTES.
    // Le mod MEI a ete refait (GUIDs regeneres + roles renommes : LMG1/2 -> MG/MG2,
    // Bomb -> Bomber, AT1 -> AT, ARifleman* -> AR*, AG1 supprime) et FF n'a pas suivi.
    // Seul Character_MEI_Base avait garde son GUID -- c'est litteralement le seul qui
    // spawnait. Resultat en jeu : faction MEI quasi vide, repli sur du vanilla.
    // GUIDs ci-dessous DECODES DEPUIS resourceDatabase.rdb DU MOD (source de verite),
    // pas depuis les references croisees qui contiennent encore les anciens.
    // Verifier apres chaque update du mod MEI.
    m_aInfantryCharacters {
     "{18A9F48EBB87D2F0}Prefabs/Characters/Factions/IND/MEI/Character_MEI_AR.et"
     "{EADA2C708DB52BC8}Prefabs/Characters/Factions/IND/MEI/Character_MEI_AR2.et"
     "{0F4660898150BCA3}Prefabs/Characters/Factions/IND/MEI/Character_MEI_AR3.et"
     "{46CBE7ED7435A25C}Prefabs/Characters/Factions/IND/MEI/Character_MEI_AT.et"
