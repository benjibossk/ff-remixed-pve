     "{6FFEC0DEDA000209}Prefabs/Characters/Factions/IND/MEI/Character_MEI_Mavic.et"
    }
    // ⚠️ ATTENTION : cette liste NE FAIT PAS SPAWNER l'infanterie ennemie. Elle
    // n'est lue que par JWK_VehicleCrewGenerator.c:50 (passagers de vehicule) et
    // JWK_ResistanceRecruitsComponent.c:180 (recrues COTE JOUEUR). Les ennemis a
    // pied sortent exclusivement des groupes ci-dessous. C'est le piege dans lequel
    // on est tombe : Air/Javelin/Jammer etaient declares ici et nulle part ailleurs,
    // donc invisibles en jeu. Tout nouveau specialiste doit AUSSI etre ajoute a un
    // Prefabs/Groups/MEI/Group_MEI_*.et.
    // FF n'en declarait AUCUN pour MEI : pas d'equipage, donc pas de vehicules ni
    // d'helicos correctement crewes. Le mod les fournit.
    m_aPilotCharacters {
     "{8B556AC161BE7405}Prefabs/Characters/Factions/IND/MEI/Character_MEI_Crew.et"
    }
    m_aAirCrewCharacters {
     "{9EEA722ACE508FDB}Prefabs/Characters/Factions/IND/MEI/Character_MEI_HeliPilot.et"
     "{013E137EEB9F000F}Prefabs/Characters/Factions/IND/MEI/Character_MEI_HeliCrew.et"
    }
    m_aArmorCommanders {
     "{8B556AC161BE7405}Prefabs/Characters/Factions/IND/MEI/Character_MEI_Crew.et"
    }
    m_aArmorCrewmen {
     "{8B556AC161BE7405}Prefabs/Characters/Factions/IND/MEI/Character_MEI_Crew.et"
    }
    m_rDefaultGroupPrefab "{AD9B7874DFFF2A9D}Prefabs/Groups/MEI/Group_MEI_Base.et"
    // ⚠️ Les DEUX seuls groupes que FF declarait pour MEI etaient eux aussi MORTS :
    // SentryTeam {92A836D86D75707B} (vrai : {9BB41B28EB97A926}, et sous Groups/MEI/
    // et non Groups/INDFOR/MEI/) et SapperTeam {4E9F762B4C0DD5ED} (vrai :
    // {04ED87FFCC68373D}). La faction MEI de FF n'avait donc AUCUN groupe valide.
    // ATTENTION AU DOSAGE : cette liste est tiree UNIFORMEMENT (GetRandomElement), donc
    // une entree = 1 chance sur N. Les 4 patrouilles ordinaires sont volontairement
    // repetees 5 fois chacune : sans cette dilution, les 4 equipes specialistes ajoutees
    // en fin de liste representeraient 50 % des patrouilles de la carte. La on est a
    // 4/24, soit environ une patrouille sur six. Pour en voir plus ou moins, ajouter ou
    // retirer des repetitions ci-dessous -- c'est le seul reglage.
    //
    // POURQUOI LES SPECIALISTES SONT AUSSI ICI, alors qu'ils sont deja declares dans
    // m_aSpecialistGroups : Reoccupation ne lit QUE les listes PATROL et RECON (voir
    // FFRO_FreedomFightersAdapter.GetRegularEnemyPatrolGroupPrefabs), il ignore
    // totalement SPECIALIST. Sans cette ligne, ses patrouilles et ses death squads ne
    // pouvaient jamais sortir une equipe drone, AA ou antichar.
    // DOSAGE -- LIRE AVANT DE TOUCHER.
    // Cette liste est tiree UNIFORMEMENT, et les entrees EN DOUBLE NE COMPTENT PAS :
    // repeter un prefab pour le rendre plus frequent ne marche pas, le moteur ne garde
    // qu'une occurrence. Mesure faite le 2026-09-11 : avec 4 patrouilles repetees 5 fois
    // + 4 specialistes, on attendait 17 % de specialistes, on en a observe 59 % (17 sur
    // 29 patrouilles de ville en 10 min). Le seul levier est donc le NOMBRE D'ENTREES
    // DISTINCTES.
    //
    // D'ou cette liste : 12 equipes de combat ordinaires (toutes fournies par le mod MEI,
    // simplement jamais referencees par FF) + 2 specialistes = 2/14, soit environ une
    // patrouille sur sept. Drone et guerre electronique restent volontairement HORS de
    // cette liste : ils sortent par m_aSpecialistGroups et par la menace adaptative, ce
    // qui suffit a les rendre presents sans les banaliser.
    //
    // POURQUOI DES SPECIALISTES ICI : Reoccupation ne lit QUE les listes PATROL et RECON
    // (FFRO_FreedomFightersAdapter.GetRegularEnemyPatrolGroupPrefabs), il ignore
    // totalement SPECIALIST. Sans cette liste, aucune de ces equipes ne pouvait sortir
    // via Reoccupation.
    m_aPatrolGroups {
     "{9BB41B28EB97A926}Prefabs/Groups/MEI/Group_MEI_SentryTeam.et"
     "{BDBE43FE17B323D7}Prefabs/Groups/MEI/Group_MEI_FireTeam.et"
     "{DFC9AD6C43E608A7}Prefabs/Groups/MEI/Group_MEI_LightFireTeam.et"
     "{C289D03E4F13A740}Prefabs/Groups/MEI/Group_MEI_RifleSquad.et"
     "{015F1AAC16472DD2}Prefabs/Groups/MEI/Group_MEI_MachineGunTeam.et"
     "{2F91C1FC6ADAB3D9}Prefabs/Groups/MEI/Group_MEI_Team_Suppress.et"
     "{081D451BF3C817D0}Prefabs/Groups/MEI/Group_MEI_Team_GL.et"
     "{E4160FF3ED018519}Prefabs/Groups/MEI/Group_MEI_Team_LAT.et"
     "{5C6AFE7AA57EB290}Prefabs/Groups/MEI/Group_MEI_SharpshooterTeam.et"
     "{04ED87FFCC68373D}Prefabs/Groups/MEI/Group_MEI_SapperTeam.et"
     "{094294F8A8B4357E}Prefabs/Groups/MEI/Group_MEI_AmmoTeam.et"
     "{2419190B7861CBD9}Prefabs/Groups/MEI/Group_MEI_MedicalSection.et"
     // Les equipes DroneTeam / EWTeam / AATeam / ATTeam ne sont PLUS listees ici.
     // Leur frequence est desormais pilotee par les curseurs "Equipes - ..." en jeu
     // (FFRX_SpecialistWeights.c), qui les imposent au generateur avec un pourcentage
     // exact. Les laisser dans une liste FF leur donnerait une SECONDE chance de sortir
     // par le tirage uniforme, et le pourcentage affiche ne voudrait plus rien dire.
    }
    m_aReconGroups {
     "{D4E0EF34D4BC6BDB}Prefabs/Groups/MEI/Group_MEI_ReconTeam.et"
    }
    m_aSpecialistGroups {
     "{04ED87FFCC68373D}Prefabs/Groups/MEI/Group_MEI_SapperTeam.et"
     "{094294F8A8B4357E}Prefabs/Groups/MEI/Group_MEI_AmmoTeam.et"
     "{015F1AAC16472DD2}Prefabs/Groups/MEI/Group_MEI_MachineGunTeam.et"
     "{2419190B7861CBD9}Prefabs/Groups/MEI/Group_MEI_MedicalSection.et"
     "{5C6AFE7AA57EB290}Prefabs/Groups/MEI/Group_MEI_SharpshooterTeam.et"
     "{702A22210F060E93}Prefabs/Groups/MEI/Group_MEI_SniperTeam.et"
     "{4AAF649CEA888EC6}Prefabs/Groups/MEI/Group_MEI_Team_AT.et"
     "{E4160FF3ED018519}Prefabs/Groups/MEI/Group_MEI_Team_LAT.et"
     "{081D451BF3C817D0}Prefabs/Groups/MEI/Group_MEI_Team_GL.et"
     "{2F91C1FC6ADAB3D9}Prefabs/Groups/MEI/Group_MEI_Team_Suppress.et"
     // Les equipes DroneTeam / EWTeam / AATeam / ATTeam ne sont PLUS listees ici.
     // Leur frequence est desormais pilotee par les curseurs "Equipes - ..." en jeu
     // (FFRX_SpecialistWeights.c), qui les imposent au generateur avec un pourcentage
     // exact. Les laisser dans une liste FF leur donnerait une SECONDE chance de sortir
     // par le tirage uniforme, et le pourcentage affiche ne voudrait plus rien dire.
     // (bloc d'origine :)
     // FFRX -- equipes de specialistes dediees (drones / guerre electronique / AA).
     // Avant, ces specialistes etaient injectes dans les groupes de PATROUILLE via des
     // overrides de prefabs, ce qui remplacait leur composition d'origine : les patrouilles
     // MEI se retrouvaient sans un seul fusilier, et sans cout de budget. On les sort ici,
     // dans des equipes autonomes avec escorte, tirees occasionnellement.
     // Frequence : tirage uniforme (arr.GetRandomElement) -> une entree = 1 chance sur N.
     // L'equipe drone est listee deux fois pour etre un peu plus presente que les autres.
     // Le Javelin avait ete OUBLIE ici : il n'existait que dans m_aCharacters ci-dessus,
     // c'est-a-dire exactement le piege decrit dans le commentaire de cette liste (lu par
     // l'equipage de vehicule et les recrues joueur, jamais par le spawn d'infanterie).
     // Il n'a donc jamais pu apparaitre a pied. Ajoute le 2026-09-11 avec son groupe.
    }
    m_aHqGroups {
     "{E30B7B9AC1E82157}Prefabs/Groups/MEI/Group_MEI_PlatoonHQ.et"
    }
   }
  }
  m_CombatCompositions JWK_CombatFactionCompositionsConfig "{66BF2135933D80BD}" : "{A32E2EF6C6706807}Configs/Factions/Utils/Compositions/Combat_FIA.conf" {
