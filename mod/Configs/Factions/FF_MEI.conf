  }
  m_Loadout JWK_LoadoutConfig "{66BF2135BA3676CE}" : "{FFC873580104C1F1}Configs/Factions/Utils/Loadouts/Loadout_MEI.conf" {
  }
  m_Radio JWK_FactionRadioConfig "{66BF21354224FA55}" : "{403EF52A4476A109}Configs/Factions/Utils/Radio/Radio_FIA.conf" {
