     "{E6324648D7C20957}Prefabs/Characters/Factions/IND/MEI/Character_MEI_Medic.et"
     "{8A6672A86B068679}Prefabs/Characters/Factions/IND/MEI/Character_MEI_MG.et"
     "{307A5448B2E63ECC}Prefabs/Characters/Factions/IND/MEI/Character_MEI_MG2.et"
     "{F95AEA26749B12EC}Prefabs/Characters/Factions/IND/MEI/Character_MEI_Rifleman1.et"
     "{950EDEC6C85F9DC2}Prefabs/Characters/Factions/IND/MEI/Character_MEI_Rifleman2.et"
