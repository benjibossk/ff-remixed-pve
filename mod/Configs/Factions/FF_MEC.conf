// l'Est, c'est la rupture d'immersion la plus visible du theatre -- bien plus qu'un
// visage. On redeclare donc m_aVehicles SANS `+`, ce qui REMPLACE la liste heritee
// par un parc local. Les attributs FF de ces vehicules sont dans
// Configs/Addons/FFRX_Anizay_Vehicles.conf.
//
// Si le mod Zagoria 89 Vehicles n'est pas charge, ces references ne resolvent pas :
// les civils n'auront aucun vehicule, ce qui reste preferable aux Skoda.
