// FF - REMIXED - PVE
// Les jumelles Thales OB 72 Sophie de l'arsenal = NOTRE version, celle qui designe au laser.
//
// ======================================================================================
//  CE QU'ON FAIT, ET POURQUOI EN DEUX ENDROITS
// ======================================================================================
//
// AMF-FANTASSIN fournit des Sophie purement optiques (grossissement + thermique, pas de
// designation laser). On a produit FFRX_OB72_Sophie_LASER.et : meme modele AMF, mais
// heritant du SOFLAM de TacticalFlava, donc capable de designer une cible.
//
// Avoir les DEUX dans l'arsenal n'aurait aucun sens : deux entrees au nom identique, dont
// une inferieure, et le joueur n'a aucun moyen de les distinguer avant de les prendre.
//
//   1. RETRAIT de la Sophie d'origine  -> Configs/EntityCatalog/FR/InventoryItems_EntityCatalog_FR.conf
//      (entree {67353BB7DF6D5D66}, desactivee par GUID d'instance comme les galons)
//   2. AJOUT de la notre             -> CE FICHIER
//
// Pourquoi ne pas ajouter la notre directement dans le catalogue ? Parce qu'ajouter un
// ELEMENT NEUF a une liste d'un .conf d'un autre addon est le cas ou l'override est le
// plus fragile : un GUID d'instance neuf dans une liste existante est ignore SANS erreur
// (cf. memoire enfusion-override-instance-guid). Desactiver une entree EXISTANTE, en
// revanche, fonctionne -- c'est deja ce que font les 67 galons dans ce meme fichier.
//
// On passe donc par JWK_AddonIntegrationConfig, exactement comme pour l'AT-4 : c'est le
// mecanisme de FF prevu pour injecter un item dans les factions, il ne touche a aucun
// fichier tiers, et si le prefab manque l'entree ne resout simplement pas.
//
// Prix aligne sur la Sophie d'origine (10 supplies) plus une marge pour la designation
// laser, qui est une capacite d'appui, pas un accessoire d'observation.

JWK_AddonIntegrationConfig {
 m_aItemAttributes {
  JWK_ItemAttributesConfigRule "{6FFEC0DEB0C10001}" {
   m_sTitle "Jumelles OB 72 Sophie (designation laser)"
   m_aPrefabs {
    "{6FFEC0DEB0C00001}Prefabs/Items/Equipment/Binoculars/FFRX_OB72_Sophie_LASER.et"
   }
   m_ShopItemAttributes JWK_ShopItemAttributes "{6FFEC0DEB0C10002}" {
    m_iMoneyPrice 400
    m_iSuppliesPrice 25
   }
   m_AddToFactions JWK_FactionsTargetingConfig "{6FFEC0DEB0C10003}" {
    m_aTargetFactionRoles {
     PLAYER
     SUPPORTING
    }
   }
  }

  // ==================================================================================
  //  LA CHAINE DE TIR GUIDE : sans elle, la designation laser ne sert a rien
  // ==================================================================================
  //
  // La Sophie DESIGNE. Il faut encore de quoi TIRER sur ce qu'elle designe, sinon la
  // capacite est decorative. TacticalFlava fournit exactement trois pieces, toutes
  // presentes dans son catalogue TF_US -- on reprend ses prix et ses types tels quels
  // plutot que d'en inventer.
  //
  //   1. MMS Programmer  -- programme la munition guidee (code laser, fusee)
  //   2. Obus 81 mm RCGM -- l'obus de mortier guide
  //   3. Roquette APKWS  -- la roquette 70 mm guidee, tiree d'helicoptere
  //
  // Reference TF_US (Configs/EntityCatalog/TF_US/InventoryItems_EntityCatalog_TF_US.conf) :
  //   RCGM       -> MORTARS / AMMUNITION,   45 supplies, grade requis SERGEANT
  //   Programmer -> EQUIPMENT,               5 supplies
  //   APKWS      -> HELICOPTER / AMMUNITION, 60 supplies

  JWK_ItemAttributesConfigRule "{6FFEC0DEB0C10011}" {
   m_sTitle "Programmateur MMS (munitions guidees)"
   m_aPrefabs {
    "{95DC7FA72AE32F0E}Prefabs/Items/Equipment/Programmer/MMS_Programmer.et"
   }
   m_ShopItemAttributes JWK_ShopItemAttributes "{6FFEC0DEB0C10012}" {
    m_iMoneyPrice 80
    m_iSuppliesPrice 5
   }
   m_AddToFactions JWK_FactionsTargetingConfig "{6FFEC0DEB0C10013}" {
    m_aTargetFactionRoles {
     PLAYER
     SUPPORTING
    }
   }
  }

  // Obus de mortier 81 mm guide. C'est LUI qui boucle la chaine sans rien demander
  // d'autre : un observateur designe a la Sophie, un servant tire au mortier. Aucun
  // aeronef necessaire -- c'est la piece la plus utile des trois pour du PVE a pied.
  JWK_ItemAttributesConfigRule "{6FFEC0DEB0C10014}" {
   m_sTitle "Obus 81 mm M821 RCGM (guide laser)"
   m_aPrefabs {
    "{ED3BBD90E8DBD50F}Prefabs/Weapons/Ammo/TF_Ammo_Shell_81mm_HE_M821_RCGM.et"
   }
   m_ShopItemAttributes JWK_ShopItemAttributes "{6FFEC0DEB0C10015}" {
    m_iMoneyPrice 700
    m_iSuppliesPrice 45
   }
   m_AddToFactions JWK_FactionsTargetingConfig "{6FFEC0DEB0C10016}" {
    m_aTargetFactionRoles {
     PLAYER
     SUPPORTING
    }
   }
  }

  // Roquette APKWS.
  //
  // ATTENTION : elle ne se tire que depuis un panier M260 monte sur UH-1H. Tant qu'aucun
  // UH-1H APKWS n'est accessible aux joueurs, cette entree est ACHETABLE MAIS INUTILISABLE.
  // Elle est mise ici parce qu'elle fait partie de la chaine demandee ; si on decide de ne
  // pas donner d'helicoptere aux joueurs, il faut la retirer plutot que de laisser un
  // article qui prend 60 supplies sans rien pouvoir en faire.
  JWK_ItemAttributesConfigRule "{6FFEC0DEB0C10017}" {
   m_sTitle "Roquette 70 mm M229 APKWS (guide laser)"
   m_aPrefabs {
    "{7735AEB9904230F7}Prefabs/Weapons/Ammo/Ammo_Rocket_Hydra70_HE_M229_APKWS.et"
   }
   m_ShopItemAttributes JWK_ShopItemAttributes "{6FFEC0DEB0C10018}" {
    m_iMoneyPrice 900
    m_iSuppliesPrice 60
   }
   m_AddToFactions JWK_FactionsTargetingConfig "{6FFEC0DEB0C10019}" {
    m_aTargetFactionRoles {
     PLAYER
     SUPPORTING
    }
   }
  }
 }
}
