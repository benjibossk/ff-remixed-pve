// MiddleEastInsurgents {64CEC8E005828E5D}.
// Ces mods ne sont VOLONTAIREMENT PAS en dependance de FF-REMIXED : un serveur Everon
// ne doit pas les telecharger. Un serveur Anizay doit les charger dans SA liste de
// mods. S'ils sont absents, ces entrees ne resolvent pas et FF continue sans eux.
//
// TOUS les GUIDs ci-dessous ont ete VERIFIES par spawn reel dans le World Editor
// (12/12 + T55 + BMP2). Ne pas se fier aux noms : `BMP2_Olive.et` existe dans les
// references du mod mais est une ressource MORTE -- seul `BMP2_Olive_test.et` resout,
// malgre son nom. Les chemins de ces mods n'ont pas de prefixe `Prefabs/`.
//
// POURQUOI CE FICHIER : un vehicule tiers n'embarque pas de JWK_VehicleAttributes.
// Sans ces attributs FF ne sait ni ce qu'est le vehicule ni ou le garer, et il ne
// spawne pas (cause n°1 des "vehicle has missing or invalid attributes").
//
// GOTCHA deux-roues : MOTORBIKE/TWOWHEELER existent mais presque aucun emplacement de
// parking des mondes ne porte le tag TWOWHEELER -> les deux-roues ne spawneraient
// jamais. On les declare donc en CAR/CAR.
