// FF - REMIXED - PVE -- la BALISE GPS a l'arsenal.
//
// Prefab : {4A6130315BCBD1EE}Prefabs/Items/Equipment/Radios/FFRX_GpsBeacon.et
// Code    : Scripts/Game/FFRX/FFRX_Beacon.c + FFRX_BeaconActions.c
//
// POURQUOI CE MECANISME. Meme voie que l'AT-4 et les jumelles Sophie :
// JWK_AddonIntegrationConfig est le crochet prevu par FF pour injecter un item dans des
// factions sans toucher a un seul fichier tiers. Si le prefab ne resout pas, l'entree est
// simplement ignoree -- rien d'autre ne casse.
//
// POURQUOI RATTACHE A RealisticCombatDrones (65AD60E204191D37). Notre balise DERIVE de
// `FPVBattery.et`, qui vit dans ce mod ; sans lui, le prefab n'existe pas. Le mod n'est PAS
// une dependance directe de REMIXED, mais il arrive en TRANSITIF par JamAiDrones
// (69142B53324289C0 -> 690D33EDCB46C4B9 -> 65AD60E204191D37), qui l'est. Verifie le
// 2026-09-21 dans les .gproj. Rattacher l'integration a ce GUID-la est donc la description
// honnete de la vraie condition d'existence de l'item.
//
// LE PRIX. 25 supplies : plus qu'une radio (l'objet transmet une position a toute
// l'escouade), moins qu'un lance-roquettes. Et la balise n'est pas un achat unique -- la
// tenir allumee consomme des cellules de drone, qui sont elles-memes une ressource. Pas de
// prix en argent : le mod n'a pas d'economie monetaire (cf. FFRX_DarcIntegration).
//
// Cible : les ROLES PLAYER et SUPPORTING plutot que les cles de faction, pour que ca marche
// sur les DEUX theatres (FIA sur Everon, FIA_DESERT sur Anizay) sans dupliquer l'entree.

JWK_AddonIntegrationConfig {
 m_aItemAttributes {
  // --- Sac radio longue portee ------------------------------------------------------
  // 40 ravitaillement, soit plus cher que la balise (25) : ce n'est pas un objet
  // individuel mais un multiplicateur d'ESCOUADE -- celui qui le porte tient la liaison
  // de tout le groupe. Et il fait de son porteur une cible qui vaut la peine.
  //
  // Meme rattachement que la balise (RealisticCombatDrones) : le sac derive de TECPACK45L
  // mais son interet depend entierement du systeme de signal, lui-meme inutile sans les
  // tours radio. Le GUID declare reste celui qui conditionne l'existence des prefabs.
  JWK_ItemAttributesConfigRule "{6FFEC0DEBEAC0200}" {
   m_sTitle "Sac radio longue portee"
   m_aPrefabs {
    "{35BE28F1F59F087D}Prefabs/Items/Equipment/Backpacks/FFRX_RadioBackpack.et"
   }
   m_ShopItemAttributes JWK_ShopItemAttributes "{6FFEC0DEBEAC0201}" {
    m_iMoneyPrice 0
    m_iSuppliesPrice 40
   }
   m_AddToFactions JWK_FactionsTargetingConfig "{6FFEC0DEBEAC0202}" {
    m_aTargetFactionRoles {
     PLAYER
     SUPPORTING
    }
   }
  }
  JWK_ItemAttributesConfigRule "{6FFEC0DEBEAC0100}" {
   m_sTitle "Balise GPS"
   m_aPrefabs {
    "{4A6130315BCBD1EE}Prefabs/Items/Equipment/Radios/FFRX_GpsBeacon.et"
   }
   m_ShopItemAttributes JWK_ShopItemAttributes "{6FFEC0DEBEAC0101}" {
    m_iMoneyPrice 0
    m_iSuppliesPrice 25
   }
   m_AddToFactions JWK_FactionsTargetingConfig "{6FFEC0DEBEAC0102}" {
    m_aTargetFactionRoles {
     PLAYER
     SUPPORTING
    }
   }
  }
 }
}
