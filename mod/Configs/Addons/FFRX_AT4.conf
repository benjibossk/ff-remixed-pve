// FF - REMIXED - PVE -- integration du mod AT-4 (Workshop GUID 64E37695015F8AFA).
//
// PAS UNE DEPENDANCE : le mod n'est PAS declare dans addon.gproj. Un serveur qui ne
// le charge pas ignore simplement ce fichier (FF saute l'integration quand le GUID
// d'addon n'est pas monte). Un serveur qui veut l'AT4 l'ajoute a SA liste de mods.
//
// L'AT4 est un lance-roquettes JETABLE : `Disposable 1` + `AmmoTemplate` integre dans
// le prefab -> AUCUN chargeur a vendre a cote, l'arme part chargee et se jette. Ne pas
// ajouter les `Prefabs/Weapons/Ammo/Ammo_*_Rocket_AT4.et` au catalogue : ce sont des
// projectiles (classe Projectile), pas des objets d'inventaire.
//
// GUIDs releves dans le resourceDatabase.rdb du mod ET recoupes avec les references
// croisees des .et extraits (methode : cf. memoire ff-mei-faction-broken-guids).
//
// Variantes retenues (les 5 lanceurs complets du mod) :
//   Launcher_AT4_base    = AT4 HEAT   (anti-blindage)
//   Launcher_AT4_HE      = AT4 HE     (anti-personnel)
//   Launcher_AT4_HEDP    = AT4 HEDP   (polyvalent)
//   Launcher_AT4CS_base  = AT4CS HEAT (tir en espace clos)
//   Launcher_AT4CS_HEDP  = AT4CS HEDP (tir en espace clos)
//
// Prix calibres sur le RPG-7 de FF (Configs/Items/Vanilla.conf : 600$ / 30 ravito).
// Le HEAT jetable vaut le RPG ; HEDP/HE et les CS sont un cran au-dessus.
//
// Cible : les roles PLAYER et SUPPORTING plutot que les cles de faction, pour que ca
// marche sur les DEUX theatres (FIA sur Everon, FIA_DESERT sur Anizay) sans dupliquer.
JWK_AddonIntegrationConfig {
 m_aItemAttributes {
  JWK_ItemAttributesConfigRule "{6FFEC0DEA7040001}" {
   m_sTitle "AT4 HEAT"
   m_aPrefabs {
    "{D0B1954ADADE4BFF}Prefabs/Weapons/Launchers/AT4/Launcher_AT4_base.et"
   }
   m_ShopItemAttributes JWK_ShopItemAttributes "{6FFEC0DEA7040002}" {
    m_iMoneyPrice 600
    m_iSuppliesPrice 30
   }
   m_AddToFactions JWK_FactionsTargetingConfig "{6FFEC0DEA7040003}" {
    m_aTargetFactionRoles {
     PLAYER
     SUPPORTING
    }
   }
  }
  JWK_ItemAttributesConfigRule "{6FFEC0DEA7040004}" {
   m_sTitle "AT4 HE / HEDP"
   m_aPrefabs {
    "{D98BE0413A329708}Prefabs/Weapons/Launchers/AT4/Launcher_AT4_HE.et"
    "{169BF0F0AA06C787}Prefabs/Weapons/Launchers/AT4/Launcher_AT4_HEDP.et"
   }
   m_ShopItemAttributes JWK_ShopItemAttributes "{6FFEC0DEA7040005}" {
    m_iMoneyPrice 650
    m_iSuppliesPrice 35
   }
   m_AddToFactions JWK_FactionsTargetingConfig "{6FFEC0DEA7040006}" {
    m_aTargetFactionRoles {
     PLAYER
     SUPPORTING
    }
   }
  }
  JWK_ItemAttributesConfigRule "{6FFEC0DEA7040007}" {
   m_sTitle "AT4CS (espace clos)"
   m_aPrefabs {
    "{040D0FA49403A696}Prefabs/Weapons/Launchers/AT4/Launcher_AT4CS_base.et"
    "{662D1F5B7FF930CD}Prefabs/Weapons/Launchers/AT4/Launcher_AT4CS_HEDP.et"
   }
   m_ShopItemAttributes JWK_ShopItemAttributes "{6FFEC0DEA7040008}" {
    m_iMoneyPrice 700
    m_iSuppliesPrice 35
   }
   m_AddToFactions JWK_FactionsTargetingConfig "{6FFEC0DEA7040009}" {
    m_aTargetFactionRoles {
     PLAYER
     SUPPORTING
    }
   }
  }
 }
 // Ceinture ET bretelles : m_AddToFactions ci-dessus enregistre les prefabs dans le
 // catalogue des factions ciblees par ROLE ; ce bloc les ajoute explicitement aux deux
 // factions joueur nommees, pour que l'arsenal les propose meme si le role n'est pas
 // encore resolu au moment ou l'integration est appliquee.
 m_aFactionAddons {
  JWK_ModFactionAddons "{6FFEC0DEA704000A}" {
   m_aTargetFactionKeys {
    "FIA"
    "FIA_DESERT"
   }
   m_aAddItems {
    "{D0B1954ADADE4BFF}Prefabs/Weapons/Launchers/AT4/Launcher_AT4_base.et"
    "{D98BE0413A329708}Prefabs/Weapons/Launchers/AT4/Launcher_AT4_HE.et"
    "{169BF0F0AA06C787}Prefabs/Weapons/Launchers/AT4/Launcher_AT4_HEDP.et"
    "{040D0FA49403A696}Prefabs/Weapons/Launchers/AT4/Launcher_AT4CS_base.et"
    "{662D1F5B7FF930CD}Prefabs/Weapons/Launchers/AT4/Launcher_AT4CS_HEDP.et"
   }
  }
 }
}
